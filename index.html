<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HORIZON &mdash; Download</title>
<style>
  :root {
    --bg: #12161D;
    --fg: #EDE6D6;
    --muted: #A9A296;
    --muted-faint: #736C60;
    --card-bg: #1B222C;
    --border: rgba(237,230,214,0.10);
    --border-strong: rgba(237,230,214,0.18);
    --accent: #C9A227;
    --accent-soft: #E4C25A;
    --accent-fg: #20180A;
    --font-display: Georgia, 'Palatino Linotype', 'Book Antiqua', serif;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .wrap {
    width: 100%;
    max-width: 560px;
    text-align: center;
  }

  .logo {
    width: 280px;
    height: 280px;
    margin: 0 auto 18px;
    display: block;
  }

  h1 {
    font-family: var(--font-display);
    font-size: clamp(32px, 6vw, 44px);
    font-weight: 500;
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }

  p.tagline {
    color: var(--muted);
    font-size: 17px;
    line-height: 1.5;
    margin: 0 0 40px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border-strong);
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.25);
  }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 15px 20px;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-fg);
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .btn:hover { background: var(--accent-soft); }
  .btn[aria-disabled="true"] {
    opacity: 0.5;
    pointer-events: none;
  }
  .btn .sub {
    font-weight: 400;
    opacity: 0.85;
    font-size: 13px;
  }

  .recommended-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: rgba(32,24,10,0.18);
    padding: 2px 8px;
    border-radius: 999px;
    margin-left: 8px;
  }

  .status {
    color: var(--muted);
    font-size: 13px;
    margin-top: 18px;
    min-height: 18px;
  }

  .status a { color: var(--accent-soft); }

  footer {
    margin-top: 28px;
    font-size: 13px;
    color: var(--muted-faint);
  }
  footer a { color: var(--muted); }
  footer a:hover { color: var(--fg); }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="logo.png" alt="HORIZON Budgeting">
    <h1>Download HORIZON</h1>
    <p class="tagline">Your personal finance dashboard. Get the latest version for your platform below.</p>

    <div class="card">
      <div class="buttons" id="buttons">
        <a class="btn" id="win-btn" aria-disabled="true" href="#">
          <span id="win-label">Checking latest version&hellip;</span>
        </a>
        <a class="btn" id="mac-btn" aria-disabled="true" href="#">
          <span id="mac-label">Checking latest version&hellip;</span>
        </a>
      </div>
      <div class="status" id="status"></div>
    </div>

    <footer>
      <span id="version-footer"></span>
    </footer>
  </div>

<script>
(function () {
  var API_URL = "https://api.github.com/repos/HorizonCharge/horizondashboard-releases/releases/latest";

  var winBtn = document.getElementById("win-btn");
  var macBtn = document.getElementById("mac-btn");
  var winLabel = document.getElementById("win-label");
  var macLabel = document.getElementById("mac-label");
  var status = document.getElementById("status");
  var versionFooter = document.getElementById("version-footer");

  var isMac = /Mac/i.test(navigator.platform);

  fetch(API_URL, { headers: { Accept: "application/vnd.github+json" } })
    .then(function (res) {
      if (!res.ok) throw new Error("GitHub API returned " + res.status);
      return res.json();
    })
    .then(function (release) {
      var assets = release.assets || [];
      var winAsset = assets.find(function (a) { return /-setup\.exe$/.test(a.name); });
      var macAsset = assets.find(function (a) { return /universal\.dmg$/.test(a.name); });

      if (winAsset) {
        winBtn.href = winAsset.browser_download_url;
        winBtn.removeAttribute("aria-disabled");
        winLabel.innerHTML = "Download for Windows" + (!isMac ? '<span class="recommended-tag">Recommended</span>' : "");
      } else {
        winLabel.textContent = "Windows build unavailable";
      }

      if (macAsset) {
        macBtn.href = macAsset.browser_download_url;
        macBtn.removeAttribute("aria-disabled");
        macLabel.innerHTML = "Download for Mac" + (isMac ? '<span class="recommended-tag">Recommended</span>' : "");
      } else {
        macLabel.textContent = "Mac build unavailable";
      }

      if (release.tag_name) {
        versionFooter.textContent = "Latest version: " + release.tag_name;
      }
    })
    .catch(function (err) {
      winLabel.textContent = "Download for Windows";
      macLabel.textContent = "Download for Mac";
      winBtn.href = "https://github.com/HorizonCharge/horizondashboard-releases/releases/latest";
      macBtn.href = "https://github.com/HorizonCharge/horizondashboard-releases/releases/latest";
      winBtn.removeAttribute("aria-disabled");
      macBtn.removeAttribute("aria-disabled");
      winBtn.target = macBtn.target = "_blank";
      winBtn.rel = macBtn.rel = "noopener";
      status.innerHTML = "Couldn't check the latest version automatically &mdash; click through to the releases page instead.";
    });
})();
</script>
</body>
</html>
